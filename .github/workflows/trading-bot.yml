name: Ken Trading Bot

on:
  schedule:
    # All times in UTC. Mountain Time = UTC-6 (MDT summer)
    - cron: '0 12 * * 1-5'    # 6:00 AM MT - Acct A Pre-market
    - cron: '0 13 * * 1-5'    # 7:00 AM MT - Acct B Signal Check
    - cron: '35 13 * * 1-5'   # 7:35 AM MT - Acct A Market Open
    - cron: '45 13 * * 1-5'   # 7:45 AM MT - Acct B Market Open
    - cron: '30 18 * * 1-5'   # 12:30 PM MT - Acct A Midday
    - cron: '0 19 * * 3'      # 1:00 PM MT Wed - Acct B Midday
    - cron: '15 20 * * 1-5'   # 2:15 PM MT - Acct A Daily Summary
    - cron: '30 20 * * 1-5'   # 2:30 PM MT - Acct B Daily Summary
    - cron: '0 21 * * 5'      # 3:00 PM MT Fri - Acct A Weekly Review
    - cron: '15 21 * * 5'     # 3:15 PM MT Fri - Acct B Weekly Review
  workflow_dispatch:           # Allow manual trigger from GitHub UI

env:
  ALPACA_KEY_A: ${{ secrets.ALPACA_KEY_A }}
  ALPACA_SECRET_A: ${{ secrets.ALPACA_SECRET_A }}
  ALPACA_KEY_B: ${{ secrets.ALPACA_KEY_B }}
  ALPACA_SECRET_B: ${{ secrets.ALPACA_SECRET_B }}
  ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
  ALPACA_DATA_ENDPOINT: ${{ secrets.ALPACA_DATA_ENDPOINT }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  PERPLEXITY_MODEL: ${{ secrets.PERPLEXITY_MODEL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
  NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
  NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  TV_WEBHOOK_SECRET: ${{ secrets.TV_WEBHOOK_SECRET }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  GITHUB_REPO: ${{ secrets.BOT_REPO }}

jobs:
  acct-a-pre-market:
    if: github.event.schedule == '0 12 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run Pre-Market Research
        run: |
          claude --dangerously-skip-permissions -p "Run the pre-market research routine. Read and follow all instructions in account-a/routines/pre-market.md exactly as written, executing every step in order."

  acct-b-signal-check:
    if: github.event.schedule == '0 13 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run Signal Check
        run: |
          claude --dangerously-skip-permissions -p "Run the signal check routine. Read and follow all instructions in account-b/routines/signal-check.md exactly as written, executing every step in order."

  acct-a-market-open:
    if: github.event.schedule == '35 13 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
