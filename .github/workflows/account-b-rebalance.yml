name: Acct-B Morning Rebalance

on:
  schedule:
    # Mon-Fri at 13:25 UTC = 09:25 ET (EDT) / 08:25 ET (EST)
    # Submits OPG orders ~5 min before market open.
    # Note: during EST (winter) this runs at 08:25 ET; OPG orders are still valid for 9:30 open.
    - cron: '25 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: account-b/scripts/requirements.txt

      - name: Install deps
        run: pip install -r account-b/scripts/requirements.txt

      - name: Run rebalance
        env:
          ALPACA_KEY_B: ${{ secrets.ALPACA_KEY_B }}
          ALPACA_SECRET_B: ${{ secrets.ALPACA_SECRET_B }}
          ALPACA_ENDPOINT: https://paper-api.alpaca.markets/v2
          ALPACA_DATA_ENDPOINT: https://data.alpaca.markets/v2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
        run: python account-b/scripts/rebalance.py
