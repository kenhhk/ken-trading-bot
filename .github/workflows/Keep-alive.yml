name: Keep Alive

on:
  schedule:
    # Runs every day at 12:00 UTC to keep repo active for cron reliability
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep repo active
        run: |
          git config user.email "bot@ken-trading-bot.com"
          git config user.name "Ken Trading Bot"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keep-alive.txt
          git add .github/keep-alive.txt
          git diff --cached --quiet && echo "no change" || git commit -m "keep-alive $(date -u +%Y-%m-%d)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true
