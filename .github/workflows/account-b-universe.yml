name: Acct-B Universe Refresh

on:
  schedule:
    # 1st of each month at 22:00 UTC (after-hours, weekday-agnostic)
    - cron: '0 22 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: account-b/scripts/requirements.txt

      - name: Install deps
        run: pip install -r account-b/scripts/requirements.txt

      - name: Run universe refresh
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_KEY_B: ${{ secrets.ALPACA_KEY_B }}
          ALPACA_SECRET_B: ${{ secrets.ALPACA_SECRET_B }}
          ALPACA_ENDPOINT: https://paper-api.alpaca.markets/v2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
        run: python account-b/scripts/refresh_universe.py
